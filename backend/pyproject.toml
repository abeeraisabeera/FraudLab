[project]
name = "kasauti-fraud-lab"
version = "1.0.0"
description = "Deterministic fraud evidence workstation — features → EBM → calibration → policy"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pandas>=2.0,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<1.7",
  "interpret-core==0.7.8",
  "python-multipart>=0.0.9",
  "mangum>=0.19,<1",
]

[tool.vercel]
entrypoint = "app:app"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27",
]
